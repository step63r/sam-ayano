name: Deploy frontend

on:
  push:
    branches: [master]
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

# 同じバケットへ同時に sync すると、index.html と assets の組み合わせが壊れうるため直列にする。
# 実行中のデプロイを途中で止めると中途半端な状態で残るので、キャンセルはしない
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  S3_BUCKET: serverless-book-management-system
  CLOUDFRONT_DISTRIBUTION_ID: E1DXDFBOHYMRDN

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # src/config.json は git 管理外。値が空のままビルドすると、壊れたアプリを本番に出してしまうため、
      # 未設定ならここで失敗させる
      - name: Generate src/config.json
        env:
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          API_ENDPOINT: ${{ vars.API_ENDPOINT }}
        run: |
          : "${COGNITO_USER_POOL_ID:?repository variable COGNITO_USER_POOL_ID is not set}"
          : "${COGNITO_CLIENT_ID:?repository variable COGNITO_CLIENT_ID is not set}"
          : "${API_ENDPOINT:?repository variable API_ENDPOINT is not set}"
          jq -n \
            --arg poolId "$COGNITO_USER_POOL_ID" \
            --arg clientId "$COGNITO_CLIENT_ID" \
            --arg api "$API_ENDPOINT" \
            '{CognitoUserPoolId: $poolId, CognitoClientId: $clientId, ApiEndpoint: $api}' \
            > src/config.json

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # assets/ はファイル名にハッシュが付くので長期キャッシュしてよい。
      # 先にアップロードしておくことで、index.html が切り替わった時点で参照先が必ず存在する。
      # 配信中の旧 index.html が参照する旧ファイルを消さないよう、assets/ には --delete を付けない
      - name: Upload assets
        run: |
          aws s3 sync build/assets "s3://${S3_BUCKET}/assets" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html などハッシュの付かないファイルは、更新を即時反映させるため no-cache にする。
      # --exclude は削除側にも効くので、上でアップロードした assets/ は --delete の対象にならない
      - name: Upload the rest
        run: |
          aws s3 sync build "s3://${S3_BUCKET}" \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
