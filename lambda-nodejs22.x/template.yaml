AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  lambda-nodejs22.x
  Sample SAM Template for lambda-nodejs22.x

Parameters:
  # 楽天ウェブサービスの認証情報。2026年2月の刷新で、UUID形式のアプリケーションIDとアクセスキーの両方が必須になった。
  # 値は楽天の管理画面でアプリを登録して取得する。秘匿情報なので NoEcho とし、
  # git で追跡されるファイル(samconfig.toml など)には書かず、デプロイ時に渡す
  RAKUTENAPPLICATIONID:
    Type: String
    NoEcho: true
  RAKUTENACCESSKEY:
    Type: String
    NoEcho: true
  # 楽天の管理画面で「許可されたWebサイト」に登録した URL。サーバーから呼ぶ際の Referer として送る。
  # 楽天側が Referer を求める場合だけ必要で、空なら送らない
  RAKUTENREFERER:
    Type: String
    Default: ""

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowMethods: "'OPTIONS,POST'"
      # AllowCredentials: true
      AllowHeaders: "'Content-Type,X-CSRF-TOKEN,Authorization'"

Resources:
  AyanoLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: ayano-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:Describe*
                  - dynamodb:List*
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
  ApiGatewayCloudWatchRoleArn:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      # ACM 証明書が ap-northeast-1 にあるため REGIONAL にする。
      # EDGE(SAM の既定)のカスタムドメインには us-east-1 の証明書が必要になる
      EndpointConfiguration:
        Type: REGIONAL
      # DNS は CloudFormation の管理外(外部で CNAME を登録する)ため Route53 は指定しない。
      # BasePath を省略すると Prod ステージが / にマップされ、URL に /Prod が付かない
      Domain:
        DomainName: api.sbms.minatoproject.com
        CertificateArn: arn:aws:acm:ap-northeast-1:966191971257:certificate/651ddb09-2203-42b0-9946-24b7eef62f28
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
      # Cors:
      #   AllowOrigin: "'*'"
      #   AllowMethods: "'OPTIONS,POST'"
      #   AllowCredentials: true
      #   AllowHeaders: "'Content-Type,X-CSRF-TOKEN,Authorization,Access-Control-Allow-Credentials,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          LoggingLevel: "INFO"
          DataTraceEnabled: true
          MetricsEnabled: true
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: arn:aws:cognito-idp:ap-northeast-1:966191971257:userpool/ap-northeast-1_CouspoB7q
  SearchRakutenBookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: search-rakuten-book/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        SearchRakutenBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /search-rakuten-book
            Method: post
            RestApiId: !Ref ApiGateway
      Environment:
        Variables:
          RAKUTEN_APPLICATION_ID: !Ref RAKUTENAPPLICATIONID
          RAKUTEN_ACCESS_KEY: !Ref RAKUTENACCESSKEY
          RAKUTEN_REFERER: !Ref RAKUTENREFERER
  SearchOpenBdFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: search-openbd/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        SearchOpenBd:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /search-openbd
            Method: post
            RestApiId: !Ref ApiGateway
  UpdateBooksFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: update-books/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        UpdateBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /update-books
            Method: post
            RestApiId: !Ref ApiGateway
  GetBooksFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: get-books/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        GetBooks:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /get-books
            Method: post
            RestApiId: !Ref ApiGateway
  GetBookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: get-book/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        GetBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /get-book
            Method: post
            RestApiId: !Ref ApiGateway
  GetBooksCountFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: get-books-count/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        GetBooksCount:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /get-books-count
            Method: post
            RestApiId: !Ref ApiGateway
  CheckExistsFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: check-exists/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        CheckExists:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /check-exists
            Method: post
            RestApiId: !Ref ApiGateway
  DeleteBookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: delete-book/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        DeleteBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /delete-book
            Method: post
            RestApiId: !Ref ApiGateway
  LendBookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: lend-book/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        LendBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /lend-book
            Method: post
            RestApiId: !Ref ApiGateway
  GetLendBookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: get-lend-book/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        GetLendBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /get-lend-book
            Method: post
            RestApiId: !Ref ApiGateway
  ReturnBookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: return-book/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Events:
        ReturnBook:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /return-book
            Method: post
            RestApiId: !Ref ApiGateway
  # 利用規約・プライバシーポリシーへの同意記録。ユーザーID(Cognito の sub) + 規約バージョンを主キーにして、
  # 同意の履歴（いつ・どの版に同意したか）をすべて残す
  ConsentTable:
    Type: AWS::DynamoDB::Table
    # 同意記録は法的な証跡になるため、スタックを削除・置換しても消えないようにする
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: termsVersion
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: termsVersion
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  # 同意状況の取得(/get-consent-status)と同意の記録(/record-consent)。
  # 規約バージョンの定数を 1 か所にまとめるため、1 つの関数で 2 つのパスを処理する
  ConsentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: consent/
      Handler: app.lambdaHandler
      Runtime: nodejs22.x
      Role: !GetAtt AyanoLambdaRole.Arn
      Architectures:
        - x86_64
      Environment:
        Variables:
          CONSENT_TABLE_NAME: !Ref ConsentTable
      Events:
        GetConsentStatus:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /get-consent-status
            Method: post
            RestApiId: !Ref ApiGateway
        RecordConsent:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /record-consent
            Method: post
            RestApiId: !Ref ApiGateway

# Outputs:
#   # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
#   # Find out more about other implicit resources you can reference within SAM
#   # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
#   SearchRakutenBookApi:
#     Description: API Gateway endpoint URL for Prod stage for Search Rakuten Book function
#     Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/search-rakuten-book/
#   SearchRakutenBookFunction:
#     Description: Search Rakuten Book Lambda Function ARN
#     Value: !GetAtt SearchRakutenBookFunction.Arn
#   SearchOpenBdApi:
#     Description: API Gateway endpoint URL for Prod stage for Search OpenBD function
#     Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/search-openbd/
#   SearchOpenBdFunction:
#     Description: Search OpenBD Lambda Function ARN
#     Value: !GetAtt SearchOpenBdFunction.Arn
#   UpdateBooksApi:
#     Description: API Gateway endpoint URL for Prod stage for Update Books function
#     Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/update-books/
#   UpdateBooksFunction:
#     Description: Update Books Lambda Function ARN
#     Value: !GetAtt UpdateBooksFunction.Arn
#   GetBooksApi:
#     Description: API Gateway endpoint URL for Prod stage for Get Books function
#     Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-books/
#   GetBooksFunction:
#     Description: Get Books Lambda Function ARN
#     Value: !GetAtt GetBooksFunction.Arn
#   GetBookApi:
#     Description: API Gateway endpoint URL for Prod stage for Get Book function
#     Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/get-book/
#   GetBookFunction:
#     Description: Get Book Lambda Function ARN
#     Value: !GetAtt GetBookFunction.Arn
#   GetBooksCountFunction:
#     Description: Get Books Count Lambda Function ARN
#     Value: !GetAtt GetBooksCountFunction.Arn
#   CheckExistsFunction:
#     Description: Check Exists Lambda Function ARN
#     Value: !GetAtt CheckExistsFunction.Arn